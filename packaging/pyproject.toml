[build-system]
# Source-free packaging: only setuptools/wheel, NO cmake/pybind11 — this wheel
# bundles a pre-compiled _core.so and compiles nothing.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
