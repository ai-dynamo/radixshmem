[build-system]
requires = ["scikit-build-core>=1.1", "pybind11==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "radixshmem"
dynamic = ["version"]
description = "Shared-memory radix index and slot store for KV cache sharing"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "ATTRIBUTIONS.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["numpy", "grpcio>=1.60"]

[project.urls]
Homepage = "https://github.com/ai-dynamo/radixshmem"
Documentation = "https://github.com/ai-dynamo/radixshmem/blob/main/docs/api.md"
Issues = "https://github.com/ai-dynamo/radixshmem/issues"

[project.scripts]
radix-server = "radixshmem.cli:main"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "python/radixshmem/_version.py"

[tool.scikit-build]
minimum-version = "build-system.requires"
build.targets = ["radixshmem_core_py", "radixshmem_data_py"]
wheel.packages = ["python/radixshmem"]
sdist.exclude = ["zfl/", ".claude/", "radix-monitor/"]

[[tool.scikit-build.overrides]]
if.state = "editable"
build-dir = "build/{wheel_tag}"
editable.verbose = false

[tool.uv]
managed = true
