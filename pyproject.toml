[build-system]
requires = ["scikit-build-core>=1.1", "pybind11==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "radixshmem"
dynamic = ["version"]
description = "Shared-memory radix index and slot store for KV cache sharing"
readme = "python/README.pypi.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "ATTRIBUTIONS.md"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["numpy", "grpcio>=1.60"]

[project.optional-dependencies]
# The nixl transfer backend; NIXL publishes no Python 3.14 wheels yet.
nixl = ['nixl-cu13>=1.4.1,<2; python_version < "3.14"']

[project.urls]
Homepage = "https://github.com/ai-dynamo/radixshmem"
Documentation = "https://github.com/ai-dynamo/radixshmem/blob/main/docs/api.md"
Issues = "https://github.com/ai-dynamo/radixshmem/issues"

[project.scripts]
radix-server = "radixshmem.cli:main"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "python/radixshmem/_version.py"

[tool.scikit-build]
minimum-version = "build-system.requires"
build.targets = ["radixshmem_core_py"]
wheel.packages = ["python/radixshmem"]
sdist.exclude = ["zfl/", ".claude/", "radix-monitor/"]

[[tool.scikit-build.overrides]]
if.state = "editable"
build-dir = "build/{wheel_tag}"
editable.verbose = false

[tool.cibuildwheel]
build = ["cp310-manylinux_x86_64", "cp311-manylinux_x86_64", "cp312-manylinux_x86_64",
         "cp313-manylinux_x86_64", "cp314-manylinux_x86_64"]
# Built from packaging/manylinux/Dockerfile.
manylinux-x86_64-image = "radixshmem-manylinux"
test-sources = ["packaging/smoke_test.py", "python/tests"]
test-requires = ["pytest"]
test-command = [
    "python packaging/smoke_test.py",
    "python -m pytest -q -p no:cacheprovider python/tests/test_geometry.py python/tests/test_radixshmem.py python/tests/test_monitor.py python/tests/test_server_rpc.py python/tests/test_transfer_jobs.py python/tests/test_writeback.py python/tests/test_slot_transfer.py",
    "python python/tests/test_radixshmem_data.py",
]

[tool.cibuildwheel.linux]
environment = { SKBUILD_CMAKE_DEFINE = "ENABLE_MOONCAKE=ON;MOONCAKE_ROOT=/opt/mooncake" }
# rdma-core and libnuma come from the host: rdma-core's providers must match the host's driver stack.
repair-wheel-command = [
    "auditwheel repair --exclude libibverbs.so.1 --exclude libmlx5.so.1 --exclude libnuma.so.1 --exclude 'libnl-*' -w {dest_dir} {wheel}",
    "python {project}/packaging/check_wheel.py {dest_dir}",
]

[tool.uv]
managed = true
