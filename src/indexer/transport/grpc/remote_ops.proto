// Unary control RPCs, no KV data; request failures use gRPC status, business failures use error; reserve retired field numbers.

syntax = "proto3";

package radixshmem.remoteops.v1;

service RemoteOps {
  rpc Allocate(AllocateRequest) returns (AllocateResponse);
  rpc AllocateComponents(AllocateComponentsRequest) returns (AllocateComponentsResponse);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc Insert(InsertRequest) returns (InsertResponse);
  rpc InsertPath(InsertPathRequest) returns (InsertPathResponse);
  rpc Recycle(RecycleRequest) returns (RecycleResponse);
  rpc Unlock(UnlockRequest) returns (UnlockResponse);
  rpc DedupPrefix(DedupPrefixRequest) returns (DedupPrefixResponse);
}

// Mirrors radixshmem::InsertError (types.h); values are the same.
enum InsertError {
  INSERT_ERROR_OK = 0;
  INSERT_ERROR_NODE_POOL_FULL = 1;
  INSERT_ERROR_DATA_POOL_FULL = 2;
  INSERT_ERROR_HT_POOL_FULL = 3;
  INSERT_ERROR_MEMPOOL_FULL = 4;
  INSERT_ERROR_REMOTE_FAILED = 5;
  INSERT_ERROR_BAD_REQUEST = 6;
  INSERT_ERROR_FULL_PATH_MISSING = 7;
}

// Mirrors radixshmem::ComponentType (component_kind.h); the pool an op works on.
enum Component {
  COMPONENT_FULL = 0;
  COMPONENT_SWA = 1;
  COMPONENT_MAMBA = 2;
}

// Reserve `num_blocks` slots; no hashes, no dedup. All-or-nothing.
message AllocateRequest {
  int32 num_blocks = 1;
  Component component = 2;
}
message AllocateResponse {
  InsertError error = 1;
  repeated int32 slots = 2;  // num_blocks entries when error is OK, else empty
}

// Reserve slots from several pools at once; all of them or none.
message ComponentCount {
  Component component = 1;
  int32 num_blocks = 2;
}
message AllocateComponentsRequest {
  repeated ComponentCount components = 1;
}
message ComponentSlots {
  repeated int32 slots = 1;
}
message AllocateComponentsResponse {
  InsertError error = 1;
  repeated ComponentSlots components = 2;  // one per request entry when error is OK, else none
}

// A lock pins only a hit longer than `incumbent`, FULL only from min(full_from, hit).
message QueryRequest {
  repeated fixed64 hashes = 1;
  bool lock = 2;          // pin the hit until Unlock
  bool update_meta = 3;   // bump LRU on the target
  uint32 mask = 4;        // components to match, COMPONENT_MASK_* bits
  uint32 incumbent = 5;
  uint32 full_from = 6;
}
// What Query(lock) pinned: block ranges of FULL and SWA, the node END whose Mamba
// checkpoint it holds, and the last pinned node's blocks past the request's hashes.
message Pin {
  uint32 full_start = 1;
  uint32 full_end = 2;
  uint32 swa_start = 3;
  uint32 swa_end = 4;
  uint32 mamba_end = 5;   // 0 = none
  repeated fixed64 tail = 6;
}
message Checkpoint {
  int32 slot = 1;
}
message QueryResponse {
  int32 hit_length = 1;
  repeated int32 slots = 2;       // FULL [min(full_from, hit_length), hit_length)
  reserved 3, 4;                  // pin_end, pin_tail: now in pin
  uint32 swa_start = 5;
  repeated int32 swa_slots = 6;   // SWA [swa_start, hit_length)
  Checkpoint mamba = 7;           // the Mamba checkpoint at hit_length
  Pin pin = 8;
}

// Publish slots[i] for hashes[start + i] after the KV transfer completed.
message InsertRequest {
  repeated fixed64 hashes = 1;
  repeated int32 slots = 2;
  int32 start = 3;
  bool auto_recycle = 4;  // target recycles the slots it did not consume
  Component component = 5;
}
message InsertResponse {
  InsertError error = 1;
  repeated int32 unused_slots = 2;
}

message ComponentRun {
  Component component = 1;
  int32 end = 2;
  repeated int32 slots = 3;
}
message InsertPathRequest {
  repeated fixed64 hashes = 1;
  int32 start = 2;
  repeated int32 full_slots = 3;
  repeated ComponentRun runs = 4;
  bool auto_recycle = 5;
}
message InsertPathResponse {
  InsertResponse full = 1;
  repeated InsertResponse runs = 2;
}

// Return slots that were allocated but never published.
message RecycleRequest {
  repeated int32 slots = 1;
  Component component = 2;
}
message RecycleResponse {}

// Drop what a Query(lock) over the same hashes pinned. Not idempotent: never replayed.
message UnlockRequest {
  repeated fixed64 hashes = 1;
  reserved 2, 3, 4, 5;   // start, length, pin_end, pin_tail: now in pin
  Pin pin = 6;
}
message UnlockResponse {}

// An SWA cell at block `pos`, or a Mamba checkpoint at the END pos + 1.
message MovedCell {
  Component component = 1;
  int32 pos = 2;
  int32 slot = 3;
  uint64 age_ns = 4;
}
// The request's [0, base) plus `hashes`; FULL slots cover [full_from, base + len(hashes)).
message MovedPath {
  int32 base = 1;
  repeated fixed64 hashes = 2;
  int32 full_from = 3;
  repeated int32 full = 4;
  repeated uint64 full_age_ns = 5;
  repeated MovedCell cells = 6;
}

// Drop the copy the caller now holds too. With landing slots (free slots of the
// caller's pools, one entry per Component) the target also writes what blocks the
// drop into them and lists it in `moved`.
message DedupPrefixRequest {
  repeated fixed64 hashes = 1;
  int32 rank = 2;
  int32 tail_cap = 3;
  int32 branch_cap = 4;
  repeated ComponentSlots landing = 5;
}
message DedupPrefixResponse {
  int32 freed = 1;
  repeated MovedPath moved = 2;
  repeated ComponentSlots unused = 3;   // landing slots nothing was written to
}
