[build-system]
requires = ["setuptools>=64", "pybind11==3.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radixshmem"
version = "0.1.0"
description = "Shared-memory RadixTree for KV cache prefix matching"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = ["numpy", "grpcio>=1.60"]

# PEP 621 metadata wins over setup.py, so the console script has to live here —
# entry_points in setup.py is silently ignored while this table exists.
[project.scripts]
radix-server = "radixshmem.cli:main"

[tool.uv]
managed = true
